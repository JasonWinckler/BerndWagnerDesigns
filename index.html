<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Bernd Wagner Designs – Zwei Welten. Eine Handschrift.</title>
  <meta name="description" content="Willkommen bei Bernd Wagner Designs. Entdecken Sie die Luxury Collection oder die Streetwear Collection.">
  <link rel="icon" href="assets/logo-marke-bw.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="landing">
  <a class="skip" href="#collections">Zu den Kollektionen</a>
  <section class="welcome-popup" aria-labelledby="welcome-title">
    <div class="welcome-popup-content">
      <p class="welcome-kicker">Exklusive Kollektionen</p>
      <h1 id="welcome-title"><span>Willkommen bei</span> Bernd Wagner Designs</h1>
      <span class="welcome-divider" aria-hidden="true"></span>
      <p>Zwei Welten. Eine Handschrift.</p>
    </div>
  </section>
  <header class="landing-header">
    <a href="index.html" class="landing-brand" aria-label="Bernd Wagner Designs Startseite">
      <img src="assets/logo-bernd-wagner-designs.svg" alt="Bernd Wagner Designs" width="260" height="60">
    </a>
    <p>Private Collections · Made on Request</p>
  </header>

  <main id="collections">
    <section class="collection-choice" aria-label="Kollektion wählen">
      <div class="choice-stage" data-choice-stage>
        <a class="choice choice-luxury" href="luxury/" aria-label="Luxurious Collection entdecken">
          <img src="upload/BannerLinks.png" alt="" width="1672" height="941">
          <span class="sr-only">Luxurious Collection entdecken</span>
        </a>
        <a class="choice choice-street" href="streetwear/" aria-label="Streetwear Collection entdecken">
          <img src="upload/BannerRechts.png" alt="" width="1672" height="941">
          <span class="sr-only">Streetwear Collection entdecken</span>
        </a>
      </div>
    </section>
  </main>
  <footer class="landing-footer"><span>© <span data-year></span> Bernd Wagner Designs</span><nav><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></nav></footer>
</body>
</html>
